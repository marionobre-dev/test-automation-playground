name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint PHP
        run: find public -name '*.php' -print0 | xargs -0 -n1 php -l

      # Append the commit to CSS/JS URLs so Cloudflare and browsers never serve stale copies.
      - name: Version asset URLs
        run: |
          sed -i -E "s#(assets/[A-Za-z0-9_-]+\.(css|js))\"#\1?v=${GITHUB_SHA::7}\"#g" public/*.html
          grep -ho 'assets/[^"]*?v=[0-9a-f]*' public/*.html | sort | uniq -c

      # Only changed files are uploaded; the action keeps a state file on the server.
      - name: Upload over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/api/data/**

      - name: Smoke test
        if: vars.SITE_URL != ''
        run: |
          curl -fsS "${{ vars.SITE_URL }}/" -o /dev/null
          curl -fsS "${{ vars.SITE_URL }}/api/health"
